name: Keep dashboard awake

# Streamlit Community Cloud hibernates apps after ~12 hours with no
# traffic, and pushing commits does not reset that timer -- only actual
# visits do (per Streamlit's own docs and community moderators). This
# pings the deployed app every 6 hours, comfortably under that 12-hour
# threshold even accounting for occasional GitHub Actions scheduling
# delays, so it stays warm for anyone opening the link (e.g. from a
# resume) instead of showing them a "wake this app up" screen first.
#
# Separate from pipeline.yml on purpose: that workflow refreshes data,
# this one just keeps the deployed app reachable -- different concerns,
# different schedules.
#
# NOTE: this uses a headless browser (Playwright), not curl. Streamlit
# Community Cloud only resets its inactivity timer when a real viewer
# session is established -- that requires the page's JS to run and open
# a WebSocket back to the app. A plain curl request only fetches the
# static HTML shell and gets a 200, but never creates a session, so it
# does NOT prevent hibernation even though the workflow "succeeds".

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the dashboard with a real browser session
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          import sys

          URL = "https://tedeis-weather-dashboard.streamlit.app"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()

              # Wait for actual network idle, not just the initial HTML --
              # this is what forces the WebSocket handshake Streamlit
              # needs to register a viewer session.
              page.goto(URL, wait_until="networkidle", timeout=60000)

              # If the app is asleep, Streamlit Cloud shows a "Yes, get
              # this app back up!" button instead of the app itself.
              # Click it if present so the app actually wakes and this
              # run also recovers from a sleep, not just prevents future ones.
              wake_button = page.get_by_text("get this app back up", exact=False)
              if wake_button.count() > 0:
                  print("App was asleep -- clicking wake button")
                  wake_button.first.click()
                  page.wait_for_timeout(15000)

              # Give the session a few seconds to fully establish before
              # closing, so it counts as a real visit.
              page.wait_for_timeout(5000)

              title = page.title()
              print(f"Visited {URL} -- page title: {title!r}")

              browser.close()
          EOF
