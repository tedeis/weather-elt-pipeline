name: Run weather pipeline

on:
  schedule:
    # Every day at 12:00 UTC. GitHub Actions cron is the phase-1 scheduler/
    # orchestrator for this project -- see README roadmap for the planned
    # Airflow migration.
    - cron: "0 12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - "dbt_project/**"
      - "run_pipeline.py"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (ingest + dbt run + dbt test)
        run: python3 run_pipeline.py

      - name: Export gold layer to CSV for easy viewing
        run: |
          python -c "
          import duckdb
          con = duckdb.connect('data/weather.duckdb')
          con.execute(\"COPY (SELECT * FROM gold.gold_weather_daily) TO 'data/gold_weather_daily.csv' (HEADER, DELIMITER ',')\")
          "

      - name: Update forecast-accuracy-by-lead-time table (best-effort)
        # Only meaningful once someone has run `python3 ds/run_ds_pipeline.py`
        # at least once, which creates the historical-actuals bronze table
        # this depends on. continue-on-error keeps a fresh clone of this repo
        # (no DS backfill yet) from failing the whole scheduled run.
        #
        # ds/backfill_historical.py re-runs here too, not just once at setup:
        # it's what advances silver.stg_weather_historical_daily's actuals
        # forward each day (ERA5 finalizes ~5 days behind "today"). Without
        # this, the actuals side of the forecast-accuracy join freezes at
        # whatever date the one-time setup backfill happened to run on, and
        # gold.forecast_accuracy_by_lead_time never gets new overlap no
        # matter how long the forecast side keeps accumulating snapshots.
        continue-on-error: true
        env:
          # dbt-duckdb resolves profiles.yml's db path against the process's
          # cwd, not --project-dir/--profiles-dir -- an absolute path here
          # sidesteps that regardless of where this step runs from.
          DBT_DUCKDB_PATH: ${{ github.workspace }}/data/weather.duckdb
        run: |
          python3 ds/backfill_historical.py --window-days 14
          dbt run --select tag:ds --project-dir dbt_project --profiles-dir dbt_project
          python3 ds/eval_forecast_accuracy.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.duckdb data/gold_weather_daily.csv
          git diff --quiet --cached || git commit -m "chore: scheduled pipeline run [skip ci]"
          git push
